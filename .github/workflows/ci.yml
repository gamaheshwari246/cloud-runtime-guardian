name: Go tests
# Automatic runs paused at owner's request; manual execution only.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go vet ./...
      - run: go test -race ./...
      - name: Format check
        run: test -z "$(gofmt -l cmd internal)"
      - name: Compile all binaries
        run: go build -trimpath ./cmd/...
      - name: Go security regression tests
        run: go test -count=1 ./internal/identity ./internal/httpapi ./internal/containment ./internal/journal ./internal/tlscerts
      - name: Loopback ingestion and recovery smoke test
        run: ./scripts/verify-local-release.sh
