# Apply in the same namespace as the API StatefulSet. A dedicated service
# account can only read pod metadata; it cannot create, mutate or watch pods.
# Cluster-scope get is necessary when accepting events from multiple namespaces.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crg-identity-verifier
  labels: {app: cloud-runtime-guardian}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crg-identity-pod-get
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crg-identity-pod-get
subjects:
  - kind: ServiceAccount
    name: crg-identity-verifier
    namespace: REPLACE_WITH_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crg-identity-pod-get
