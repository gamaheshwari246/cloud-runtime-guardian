# OPTIONAL. Do not apply until the containment controller has been validated
# on a disposable cluster. Grants policy enforcement privileges cluster-wide.
# Replace REPLACE_WITH_NAMESPACE with the server's actual namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crg-containment-controller
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crg-containment-controller
subjects:
  - kind: ServiceAccount
    name: crg-identity-verifier
    namespace: REPLACE_WITH_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crg-containment-controller
